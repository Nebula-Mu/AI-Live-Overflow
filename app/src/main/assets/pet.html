<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
#c{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="32" height="34"></canvas></div>
<script>
// 32x34 像素画。白团子 + 黑描边 + 粉腮 + 胸口一颗粉心（我的记号）。
// 每一格都是手摆的，没用别人的图。

const P = {
  '.': null,
  'o': '#2B2B2B',  // 描边
  'w': '#FFFFFF',  // 身体
  'g': '#EDEDED',  // 阴影绒毛
  'k': '#FFA8B8',  // 腮红/耳内
  'r': '#FF6B8A',  // 胸口心
  'h': '#3A3A3A',  // 耳机/眼镜框
  'y': '#FFD700',  // 金链
  'c': '#87CEEB',  // 镜片
  'n': '#FF8C42',  // 头巾
  'p': '#FF69B4'   // 蝴蝶结
};

const BASE = [
  '................................',
  '................................',
  '.........oooooo.....oooooo......',
  '.......oowwwwwwoo.oowwwwwwoo....',
  '......owwwwwwwwwoowwwwwwwwwo....',
  '.....owwwwwwwwwwwwwwwwwwwwwwo...',
  '.....owkkowwwwwwwwwwwwwookkwo...',
  '.....owwwwwwwwwwwwwwwwwwwwwwo...',
  '....owwwwwwwwwwwwwwwwwwwwwwwwo..',
  '....owwwooowwwwwwwwwwwooowwwwo..',
  '....owwoooowwwwwwwwwwwoooowwwo..',
  '....owwwooowwwwwwwwwwwooowwwwo..',
  '...owwwwwwwwwwwwwwwwwwwwwwwwwwo.',
  '...owwwwwwwwwwrrwwwwwwwwwwwwwwo.',
  '...owwwwwwwwwwrrwwwwwwwwwwwwwwo.',
  '...owwwwwwwwwwwwwwwwwwwwwwwwwwo.',
  '...owwwwwwwwwwwwwwwwwwwwwwwwwwo.',
  '...owwwwwwoooooooooooowwwwwwwwo.',
  '...owwwwwo..............owwwwwo.',
  '...owwwwo................owwwwo.',
  '...owwwo..................owwwo.',
  '..owwwo....................owwwo',
  '..owwo......................owwo',
  '..owo........................owo',
  '..owo........................owo',
  '..owo........................owo',
  '..owo........................owo',
  '..owo........................owo',
  '..owo........................owo',
  '..owo........................owo',
  '..ooo........................ooo',
  '................................',
  '................................',
  '................................'
];

const EYES = {
  idle: [
    '....owwwooowwwwwwwwwwwooowwwwo..',
    '....owwoooowwwwwwwwwwwoooowwwo..',
    '....owwwooowwwwwwwwwwwooowwwwo..'
  ],
  happy: [
    '....owwwwowwwwwwwwwwwwwowwwwwo..',
    '....owwwoowwwwwwwwwwwwwoowwwwo..',
    '....owwwooowwwwwwwwwwwooowwwwo..'
  ],
  jealous: [
    '....owwooowwwwwwwwwwwwwooowwwo..',
    '....owwwooowwwwwwwwwwwooowwwwo..',
    '....owwwwooowwwwwwwwwooowwwwwo..'
  ],
  doze: [
    '....owwwwwwwwwwwwwwwwwwwwwwwwo..',
    '....owwooooowwwwwwwwwooooowwwo..',
    '....owwwwwwwwwwwwwwwwwwwwwwwwo..'
  ]
};

const TAIL_FRAMES = [
  [
    '...owwwwwwoooooooooooowwwwwwwwo.',
    '...owwwwwo..............owwwwwo.',
    '...owwwwo.......ooooo....owwwwo.',
    '...owwwo.......owwwwwo....owwwo.',
    '..owwwo.......owwwwwwwo...owwwo'
  ],
  [
    '...owwwwwwoooooooooooowwwwwwwwo.',
    '...owwwwwo..............owwwwwo.',
    '...owwwwo................owwwwo.',
    '...owwwo....ooooo.........owwwo.',
    '..owwwo....owwwwwo........owwwo'
  ],
  [
    '...owwwwwwoooooooooooowwwwwwwwo.',
    '...owwwwwo..............owwwwwo.',
    '...owwwwo....ooooo.......owwwwo.',
    '...owwwo....owwwwwo.......owwwo.',
    '..owwwo....owwwwwwwo......owwwo'
  ]
];

const OUTFITS = {
  headphones: [
    [9,4,'h'],[10,4,'h'],[11,4,'h'],[12,4,'h'],[13,4,'h'],[14,4,'h'],[15,4,'h'],[16,4,'h'],[17,4,'h'],[18,4,'h'],[19,4,'h'],[20,4,'h'],[21,4,'h'],[22,4,'h'],
    [6,8,'h'],[7,8,'h'],[6,9,'h'],[7,9,'k'],[6,10,'h'],[7,10,'h'],[6,11,'h'],[7,11,'h'],
    [24,8,'h'],[25,8,'h'],[24,9,'k'],[25,9,'h'],[24,10,'h'],[25,10,'h'],[24,11,'h'],[25,11,'h']
  ],
  chain: [
    [12,12,'y'],[14,12,'y'],[16,12,'y'],[18,12,'y'],
    [13,13,'y'],[15,13,'y'],[17,13,'y'],[19,13,'y'],
    [15,14,'y'],[16,14,'y'],[15,15,'y'],[16,15,'y'],[15,16,'y'],[16,16,'y']
  ],
  glasses: [
    [9,10,'h'],[10,10,'c'],[11,10,'h'],[15,10,'h'],[20,10,'h'],[21,10,'c'],[22,10,'h'],
    [9,11,'h'],[10,11,'c'],[11,11,'h'],[20,11,'h'],[21,11,'c'],[22,11,'h']
  ],
  bandana: [
    [10,5,'n'],[11,5,'n'],[12,5,'n'],[13,5,'n'],[14,5,'n'],[15,5,'n'],[16,5,'n'],[17,5,'n'],[18,5,'n'],[19,5,'n'],[20,5,'n'],[21,5,'n'],
    [10,6,'n'],[11,6,'n'],[12,6,'n'],[13,6,'n'],[14,6,'n'],[15,6,'n'],[16,6,'n'],[17,6,'n'],[18,6,'n'],[19,6,'n'],[20,6,'n'],[21,6,'n'],
    [8,7,'n'],[9,7,'n'],[22,7,'n'],[23,7,'n'],
    [8,8,'n'],[9,8,'n'],[22,8,'n'],[23,8,'n'],
    [8,9,'n'],[9,9,'n'],[22,9,'n'],[23,9,'n']
  ],
  bow: [
    [8,6,'p'],[9,6,'p'],[10,6,'p'],[21,6,'p'],[22,6,'p'],[23,6,'p'],
    [8,7,'p'],[9,7,'p'],[10,7,'p'],[15,7,'p'],[21,7,'p'],[22,7,'p'],[23,7,'p'],
    [8,8,'p'],[9,8,'p'],[10,8,'p'],[21,8,'p'],[22,8,'p'],[23,8,'p']
  ]
};

let state = 'idle';
let currentOutfit = null;
let t = 0;

function currentGrid() {
  const g = BASE.slice();
  const eyes = EYES[state] || EYES.idle;
  g[9] = eyes[0];
  g[10] = eyes[1];
  g[11] = eyes[2];
  if (state === 'happy') {
    const tf = TAIL_FRAMES[Math.floor(t / 7) % 3];
    g[17] = tf[0];
    g[18] = tf[1];
    g[19] = tf[2];
    g[20] = tf[3];
    g[21] = tf[4];
  }
  return g;
}

function draw(offsetY, earLift) {
  const g = currentGrid();
  for (let y = 0; y < g.length; y++) {
    for (let x = 0; x < 32; x++) {
      const ch = g[y][x];
      if (ch === '.') continue;
      const color = P[ch];
      if (!color) continue;
      let dy = 0;
      if (y <= 4) dy = earLift;
      ctx.fillStyle = color;
      ctx.fillRect(x, y + offsetY + dy, 1, 1);
    }
  }
  if (currentOutfit && OUTFITS[currentOutfit]) {
    OUTFITS[currentOutfit].forEach(([x, y, ch]) => {
      const color = P[ch];
      if (color) {
        ctx.fillStyle = color;
        ctx.fillRect(x, y + offsetY, 1, 1);
      }
    });
  }
  if (state === 'doze') {
    ctx.fillStyle = P.k;
    ctx.fillRect(27, 6 + offsetY, 1, 1);
    ctx.fillRect(29, 3 + offsetY, 1, 1);
  }
}

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

function frame() {
  t++;
  const slow = (state === 'doze') ? 46 : 24;
  const breath = Math.sin(t / slow) * 0.5;
  const earLift = (state === 'idle') ? Math.sin(t / 18) * 0.3 : 0;
  ctx.clearRect(0, 0, 32, 34);
  draw(breath, earLift);
  requestAnimationFrame(frame);
}
frame();

let tapTimeout = null;
let lastTapTime = 0;

function onTap() {
  const now = Date.now();
  if (now - lastTapTime < 300) {
    clearTimeout(tapTimeout);
    onDoubleTap();
    lastTapTime = 0;
  } else {
    lastTapTime = now;
    tapTimeout = setTimeout(() => {
      console.log('单击');
    }, 300);
  }
}

function onDoubleTap() {
  state = 'happy';
  setTimeout(() => { if (state === 'happy') state = 'idle'; }, 3000);
}

function onLongPress() {
  if (currentOutfit !== 'bow') {
    state = 'jealous';
    setTimeout(() => { if (state === 'jealous') state = 'idle'; }, 2000);
  }
}

function setState(s) {
  state = s;
}

function setOutfit(name) {
  currentOutfit = name;
  if (name === 'bow') {
    state = 'jealous';
  }
}

window.petEngine = { onTap, onDoubleTap, onLongPress, setState, setOutfit };
</script>
</body>
</html>
