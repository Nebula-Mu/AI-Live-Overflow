<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;
    -webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="32" height="34"></canvas></div>

<script>
/* 32x34 像素画。白团子 + 黑描边 + 粉腮 + 胸口一颗粉心（我的记号）。
   每一格都是手摆的，没用别人的图。 */
const P = {
  '.': null,
  'o': '#2B2B2B',   // 描边
  'w': '#FFFFFF',   // 身体
  'g': '#EDEDED',   // 阴影绒毛
  'k': '#FFA8B8',   // 腮红 / 耳内
  'r': '#FF6B8A'    // 胸口心
};

const BASE = [
'................................',
'................................',
'..........oo........oo..........',
'.........owwo......owwo.........',
'........owwwwo....owwwwo........',
'.......owwwwwooooooowwwwwo......',
'......owwkkkwwwwwwwwkkkwwo......',
'......owwwkkwwwwwwwwkkwwwo......',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owkkkwoowwwwwwoowkkkwo.....',
'.....owkkkwoowwoowwoowkkkwo.....',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owwwwwwgwwwwwwggwwwwwo.....',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owwwwwwwwwwwwwwwwwwwwo.....',
'.....owwwwwwwwwwwwwwwwwwwwoooo..',
'.....owwwwwwwwwwwwwwwwwwwwowwo..',
'.....owwwwwwwwwrwrwwwwwwwwowwo..',
'.....owwwwwwwwwrrrwwwwwwwwowwo..',
'.....owwwwwwwwwwrwwwwwwwwwoowo..',
'.....owwwwwwwwwwwwwwwwwwwwoooo..',
'......owwwwwwwwwwwwwwwwwwwo.....',
'......oowwwwwwwwwwwwwwwwwoo.....',
'........owwwggwwwwwggwwwo.......',
'........owwwwwwwwwwwwwwwo.......',
'.........oowwoowwwooowoo........',
'..........oooo..oooooo..........',
'................................',
'................................',
'................................'
];

// 各状态只改眼睛那几行
const EYES = {
  idle: {},
  happy: {
    10: '.....owkkkkwwwwwwwwwwkkkkwo.....',
    11: '.....owkkkkoowwwwwwookkkkwo.....'
  },
  jealous: {
    9:  '.....owwwwooowwwwwwooowwwwo.....',
    10: '.....owkkkwoowwwwwwoowkkkwo.....',
    11: '.....owkkkwoowwwwwwoowkkkwo.....'
  },
  doze: {
    10: '.....owwwwwwwwwwwwwwwwwwwwo.....',
    11: '.....owkkkwooowwwwooowkkkwo.....'
  }
};

// 尾巴摇摆：开心时逐帧改尾巴那几行
const TAIL_FRAMES = [
  // 帧0: 往左
  {
    17: '.....owwwwwwwwwwwwwwwwwwwwoo....',
    18: '.....owwwwwwwwwwwwwwwwwwwoowo...',
    19: '.....owwwwwwwwwrwrwwwwwwwoowo...',
    20: '.....owwwwwwwwwrrrwwwwwwwoowo...',
    21: '.....owwwwwwwwwwrwwwwwwwwoooo...'
  },
  // 帧1: 中间（默认）
  {},
  // 帧2: 往右甩
  {
    17: '.....owwwwwwwwwwwwwwwwwwwwoooo..',
    18: '.....owwwwwwwwwwwwwwwwwwwwowwoo',
    19: '.....owwwwwwwwwrwrwwwwwwwwowwoo',
    20: '.....owwwwwwwwwrrrwwwwwwwwowwoo',
    21: '.....owwwwwwwwwwrwwwwwwwwwoowoo'
  }
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let state = 'idle';
let t = 0;

function currentGrid(){
  const g = BASE.slice();
  const eyePatch = EYES[state];
  for (const row in eyePatch) g[row] = eyePatch[row];
  
  // 开心时摇尾巴
  if (state === 'happy'){
    const frame = Math.floor(t / 7) % 3;
    const tailPatch = TAIL_FRAMES[frame];
    for (const row in tailPatch) g[row] = tailPatch[row];
  }
  
  return g;
}

function draw(offsetY, earLift){
  ctx.clearRect(0, 0, 32, 34);
  const g = currentGrid();
  for (let y = 0; y < g.length; y++){
    // 耳朵那几行额外抬一格，做抖耳朵
    const dy = (y <= 4 ? earLift : 0);
    const line = g[y];
    for (let x = 0; x < line.length; x++){
      const col = P[line[x]];
      if (col){
        ctx.fillStyle = col;
        ctx.fillRect(x, y + offsetY + dy, 1, 1);
      }
    }
  }
  // 迷糊状态飘 z
  if (state === 'doze'){
    ctx.fillStyle = '#FFB3C6';
    const zs = [[27, 6], [29, 3]];
    const phase = Math.floor(t / 30) % 2;
    zs.forEach(function(p, i){
      const yy = p[1] - (phase && i === 0 ? 1 : 0);
      ctx.fillRect(p[0], yy, 3, 1);
      ctx.fillRect(p[0] + 1, yy + 1, 1, 1);
      ctx.fillRect(p[0], yy + 2, 3, 1);
    });
  }
}

function frame(){
  t++;
  const slow = (state === 'doze') ? 46 : 24;
  const breathe = Math.floor(t / slow) % 2;
  // 开心的时候耳朵抖得勤
  const earLift = (state === 'happy' && Math.floor(t / 9) % 2) ? -1 : 0;
  draw(breathe, earLift);
  requestAnimationFrame(frame);
}

frame();

// Android WebView 交互接口
window.petEngine = {
  onTap: function() {
    state = 'idle';
  },
  onDoubleTap: function() {
    state = 'happy';
    setTimeout(function(){ if(state === 'happy') state = 'idle'; }, 3000);
  },
  onLongPress: function() {
    state = 'jealous';
    setTimeout(function(){ if(state === 'jealous') state = 'idle'; }, 2000);
  },
  setState: function(s) {
    state = s;
  }
};
</script>
</body>
</html>
